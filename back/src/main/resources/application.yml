spring:
  application:
    name: nodum-back
  
  datasource:
    url: jdbc:postgresql://localhost:5432/nodum
    username: nodum
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration

nodum:
  admin:
    username: ${NODUM_ADMIN_USERNAME}
    password: ${NODUM_ADMIN_PASSWORD}
    email: ${NODUM_ADMIN_EMAIL}
  gateway:
    allowed-hosts: ${NODUM_GATEWAY_ALLOWED_HOSTS:}
    allow-private-addresses: ${NODUM_GATEWAY_ALLOW_PRIVATE_ADDRESSES:false}
    remote-url: ${NODUM_GATEWAY_REMOTE_URL:}
    remote-token: ${NODUM_MODULE_SERVICE_TOKEN:}
  infrastructure:
    agent-url: ${NODUM_INFRASTRUCTURE_AGENT_URL:}
    agent-token: ${NODUM_INFRASTRUCTURE_AGENT_TOKEN:}
  kafka:
    remote-url: ${NODUM_KAFKA_REMOTE_URL:}
    remote-token: ${NODUM_KAFKA_REMOTE_TOKEN:}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  
server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
