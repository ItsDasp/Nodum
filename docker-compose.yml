services:
  postgres:
    image: postgres:16-alpine
    container_name: nodum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nodum
      POSTGRES_USER: nodum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodum -d nodum"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nodum-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: nodum-back
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nodum
      SPRING_DATASOURCE_USERNAME: nodum
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      NODUM_ADMIN_USERNAME: ${NODUM_ADMIN_USERNAME:?Copy .env.example to .env and set NODUM_ADMIN_USERNAME}
      NODUM_ADMIN_PASSWORD: ${NODUM_ADMIN_PASSWORD:?Copy .env.example to .env and set NODUM_ADMIN_PASSWORD}
      NODUM_ADMIN_EMAIL: ${NODUM_ADMIN_EMAIL:?Copy .env.example to .env and set NODUM_ADMIN_EMAIL}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      NODUM_GATEWAY_ALLOWED_HOSTS: ${NODUM_GATEWAY_ALLOWED_HOSTS:-}
      NODUM_GATEWAY_ALLOW_PRIVATE_ADDRESSES: ${NODUM_GATEWAY_ALLOW_PRIVATE_ADDRESSES:-false}
      NODUM_GATEWAY_REMOTE_URL: ${NODUM_GATEWAY_REMOTE_URL:-http://gateway-module:8081}
      NODUM_MODULE_SERVICE_TOKEN: ${NODUM_MODULE_SERVICE_TOKEN:?Copy .env.example to .env and set NODUM_MODULE_SERVICE_TOKEN}
      NODUM_INFRASTRUCTURE_AGENT_URL: ${NODUM_INFRASTRUCTURE_AGENT_URL:-http://infrastructure-agent:8090}
      NODUM_INFRASTRUCTURE_AGENT_TOKEN: ${NODUM_INFRASTRUCTURE_AGENT_TOKEN:?Copy .env.example to .env and set NODUM_INFRASTRUCTURE_AGENT_TOKEN}
      NODUM_KAFKA_REMOTE_URL: ${NODUM_KAFKA_REMOTE_URL:-http://kafka-module:8082}
      NODUM_KAFKA_REMOTE_TOKEN: ${NODUM_KAFKA_REMOTE_TOKEN:?Copy .env.example to .env and set NODUM_KAFKA_REMOTE_TOKEN}
      NODUM_KAFKA_BROKERS: ${NODUM_KAFKA_BROKERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      gateway-module:
        condition: service_healthy
      kafka-module:
        condition: service_healthy
      infrastructure-agent:
        condition: service_healthy
    networks:
      - nodum-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  infrastructure-agent:
    build:
      context: ./infrastructure-agent
      dockerfile: Dockerfile
    container_name: nodum-infrastructure-agent
    restart: unless-stopped
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s
    depends_on:
      shell-image:
        condition: service_completed_successfully
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      NODUM_INFRASTRUCTURE_AGENT_TOKEN: ${NODUM_INFRASTRUCTURE_AGENT_TOKEN:?Copy .env.example to .env and set NODUM_INFRASTRUCTURE_AGENT_TOKEN}
      NODUM_DOCKER_NETWORK: nodum-network
      NODUM_GATEWAY_ALLOWED_HOSTS: ${NODUM_GATEWAY_ALLOWED_HOSTS:-}
      NODUM_GATEWAY_ALLOW_PRIVATE_ADDRESSES: ${NODUM_GATEWAY_ALLOW_PRIVATE_ADDRESSES:-false}
      NODUM_MODULE_SERVICE_TOKEN: ${NODUM_MODULE_SERVICE_TOKEN:?Copy .env.example to .env and set NODUM_MODULE_SERVICE_TOKEN}
      NODUM_KAFKA_REMOTE_TOKEN: ${NODUM_KAFKA_REMOTE_TOKEN:?Copy .env.example to .env and set NODUM_KAFKA_REMOTE_TOKEN}
      NODUM_KAFKA_BROKERS: ${NODUM_KAFKA_BROKERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    networks:
      - nodum-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gateway-module:
    image: nodum-gateway-module:1.0.0
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: nodum-gateway-module
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      NODUM_GATEWAY_ALLOWED_HOSTS: ${NODUM_GATEWAY_ALLOWED_HOSTS:-}
      NODUM_GATEWAY_ALLOW_PRIVATE_ADDRESSES: ${NODUM_GATEWAY_ALLOW_PRIVATE_ADDRESSES:-false}
      NODUM_MODULE_SERVICE_TOKEN: ${NODUM_MODULE_SERVICE_TOKEN:?Copy .env.example to .env and set NODUM_MODULE_SERVICE_TOKEN}
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s
    networks:
      - nodum-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka-module:
    image: nodum-kafka-module:1.0.0
    build:
      context: ./kafka-module
      dockerfile: Dockerfile
    container_name: nodum-kafka-module
    restart: unless-stopped
    expose:
      - "8082"
    environment:
      NODUM_MODULE_SERVICE_TOKEN: ${NODUM_KAFKA_REMOTE_TOKEN:?Copy .env.example to .env and set NODUM_KAFKA_REMOTE_TOKEN}
      NODUM_KAFKA_BROKERS: ${NODUM_KAFKA_BROKERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - nodum-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: nodum-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      - back
    networks:
      - nodum-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  shell-image:
    image: nodum-shell-module:1.0.0
    build:
      context: ./shell-module
      dockerfile: Dockerfile
    command: ["true"]
    restart: "no"
    networks:
      - nodum-network

  kafka-1:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data_1:/var/lib/kafka/data
    networks:
      nodum-network:
        aliases:
          - kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-2:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    ports:
      - "9095:9095"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data_2:/var/lib/kafka/data
    networks:
      - nodum-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-3:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    ports:
      - "9096:9096"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:9096
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data_3:/var/lib/kafka/data
    networks:
      - nodum-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nodum-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: nodum
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    networks:
      - nodum-network

volumes:
  postgres_data:
    driver: local
  kafka_data_1:
    driver: local
  kafka_data_2:
    driver: local
  kafka_data_3:
    driver: local

networks:
  nodum-network:
    name: nodum-network
    driver: bridge
