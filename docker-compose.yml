services:
  postgres:
    image: postgres:16-alpine
    container_name: nodum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nodum
      POSTGRES_USER: nodum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodum -d nodum"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nodum-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: nodum-back
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nodum
      SPRING_DATASOURCE_USERNAME: nodum
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      NODUM_ADMIN_USERNAME: ${NODUM_ADMIN_USERNAME:?Copy .env.example to .env and set NODUM_ADMIN_USERNAME}
      NODUM_ADMIN_PASSWORD: ${NODUM_ADMIN_PASSWORD:?Copy .env.example to .env and set NODUM_ADMIN_PASSWORD}
      NODUM_ADMIN_EMAIL: ${NODUM_ADMIN_EMAIL:?Copy .env.example to .env and set NODUM_ADMIN_EMAIL}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      NODUM_GATEWAY_ALLOWED_HOSTS: ${NODUM_GATEWAY_ALLOWED_HOSTS:-}
      NODUM_GATEWAY_ALLOW_PRIVATE_ADDRESSES: ${NODUM_GATEWAY_ALLOW_PRIVATE_ADDRESSES:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nodum-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: nodum-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      - back
    networks:
      - nodum-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: apache/kafka:3.8.1
    profiles: ["messaging"]
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - nodum-network

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local

networks:
  nodum-network:
    driver: bridge
